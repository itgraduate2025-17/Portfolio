<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
/* =========================================
   CSS VARIABLES & RESET
   ========================================= */
:root {
  --bg-primary: #080808;
  --bg-secondary: #0d0d0d;
  --bg-card: #111111;
  --bg-card-hover: #161616;
  --accent: rgb(212, 7, 7);
  --accent-dim: rgba(255, 0, 79, 0.15);
  --accent-glow: rgba(255, 0, 79, 0.35);
  --text-primary: #f0ece4;
  --text-secondary: #b5afa9;
  --text-muted: #4a4540;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255, 0, 79, 0.4);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', sans-serif;
  --radius: 4px;
  --transition: cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--sans);
  font-weight: 400;
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
}

/* =========================================
   GRAIN TEXTURE OVERLAY
   ========================================= */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.028;
  pointer-events: none;
  z-index: 9999;
}

/* =========================================
   HERO / HEADER
   ========================================= */
.hero {
  position: relative;
  min-height: 36vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 5rem 2rem 3rem;
  overflow: hidden;
}

/* Radial glow behind hero */
.hero::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 900px;
  height: 600px;
  background: radial-gradient(ellipse at center,
    rgba(255, 0, 79, 0.12) 0%,
    rgba(255, 0, 79, 0.04) 40%,
    transparent 70%);
  pointer-events: none;
}

/* Ghost outline text behind heading */
.hero-ghost {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -52%);
  font-family: var(--serif);
  font-size: clamp(120px, 22vw, 280px);
  font-weight: 900;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,0.04);
  white-space: nowrap;
  pointer-events: none;
  letter-spacing: -0.02em;
  user-select: none;
  opacity: 0;
  animation: fadeGhost 1.2s var(--transition) 0.2s forwards;
}

@keyframes fadeGhost {
  to { opacity: 1; }
}

.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 760px;
}

/* Eyebrow */
.eyebrow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 2rem;
  opacity: 0;
  transform: translateY(24px);
  animation: fadeUp 0.8s var(--transition) 0.3s forwards;
}

.eyebrow-line {
  width: 48px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent));
}
.eyebrow-line:last-child {
  background: linear-gradient(90deg, var(--accent), transparent);
}

.eyebrow-text {
  font-family: var(--sans);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
}

/* Main heading */
.hero-heading {
  font-family: var(--serif);
  font-size: clamp(2rem, 5.5vw, 4.5rem);
  font-weight: 900;
  line-height: 0.9;
  letter-spacing: -0.03em;
  margin-bottom: 0;
  opacity: 0;
  transform: translateY(32px);
  animation: fadeUp 0.9s var(--transition) 0.5s forwards;
}

.hero-heading em {
  font-style: italic;
  color: var(--accent);
}

/* Description */
.hero-desc {
  font-size: 1.05rem;
  color: var(--text-secondary);
  line-height: 1.8;
  max-width: 560px;
  margin: 0 auto;
  font-weight: 300;
  opacity: 0;
  transform: translateY(24px);
  animation: fadeUp 0.9s var(--transition) 0.7s forwards;
}

/* Scroll indicator */
.scroll-hint {
  position: absolute;
  bottom: 2.5rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;
  animation: fadeUp 1s var(--transition) 1.2s forwards;
}

.scroll-hint span {
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.scroll-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, var(--accent), transparent);
  animation: scrollPulse 2s ease-in-out infinite;
}

@keyframes scrollPulse {
  0%, 100% { opacity: 0.4; transform: scaleY(1); }
  50% { opacity: 1; transform: scaleY(0.6); }
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* =========================================
   MAIN CONTENT WRAPPER
   ========================================= */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem 6rem;
}

/* =========================================
   FILTER BAR
   ========================================= */
.filter-section {
  margin-bottom: 2.5rem;
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.filter-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  padding: 10px 26px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.3s var(--transition);
  white-space: nowrap;
}

.filter-btn:hover {
  border-color: var(--accent);
  color: var(--text-primary);
}

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 0 20px var(--accent-glow);
}

/* =========================================
   SEARCH
   ========================================= */
.search-section {
  margin-bottom: 3.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.search-wrap {
  position: relative;
  width: 100%;
  max-width: 560px;
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-primary);
  font-family: var(--sans);
  font-size: 0.9rem;
  padding: 13px 20px 13px 48px;
  outline: none;
  transition: all 0.3s var(--transition);
  backdrop-filter: blur(8px);
}

.search-input::placeholder { color: var(--text-muted); }

.search-input:focus {
  border-color: var(--accent);
  background: rgba(255, 0, 79, 0.04);
  box-shadow: 0 0 0 3px rgba(255,0,79,0.1);
}

.result-count {
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.06em;
}

.result-count span {
  color: var(--accent);
  font-weight: 600;
}

/* =========================================
   GRID
   ========================================= */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 28px;
}

/* =========================================
   PROJECT CARD
   ========================================= */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: background 0.4s var(--transition), border-color 0.4s var(--transition), transform 0.4s var(--transition), box-shadow 0.4s var(--transition);
  opacity: 0;
  transform: translateY(30px);
}

.card.visible {
  animation: cardReveal 0.7s var(--transition) forwards;
}

@keyframes cardReveal {
  to { opacity: 1; transform: translateY(0); }
}

.card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(255, 0, 79, 0.2);
  transform: translateY(-6px);
  box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255, 0, 79, 0.06);
}

/* Red sweep top border */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 2px;
  background: var(--accent);
  transition: width 0.5s var(--transition);
  z-index: 3;
}
.card:hover::before { width: 100%; }

/* ---- Image area ---- */
.card-img-wrap {
  position: relative;
  height: 300px;
  overflow: hidden;
}

.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.7) saturate(1.1);
  transition: filter 0.6s var(--transition), transform 0.6s var(--transition);
}

.card:hover .card-img {
  filter: brightness(0.9) saturate(1.2);
  transform: scale(1.06);
}

/* Gradient scrim - removed */
.card-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: none;
  z-index: 1;
}

/* Number badge */
.card-num {
  position: absolute;
  top: 14px;
  left: 14px;
  font-family: var(--serif);
  font-size: 0.75rem;
  font-weight: 700;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.12em;
  z-index: 2;
  background: rgba(0,0,0,0.45);
  padding: 4px 10px;
  border-radius: 3px;
  backdrop-filter: blur(6px);
}

/* Category tag */
.card-cat {
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(255, 0, 79, 0.14);
  border: 1px solid rgba(255, 0, 79, 0.3);
  padding: 4px 10px;
  border-radius: 3px;
  z-index: 2;
}

.card-zoom { display: none !important; }

/* ---- Card body ---- */
.card-body {
  padding: 16px 20px;
}

.card-title {
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.3;
  margin: 0;
  color: var(--text-primary);
  transition: color 0.3s;
  text-align: center;
}
.card:hover .card-title { color: #fff; }

/* ---- Card footer ---- */
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  border-top: 1px solid var(--border);
}

.card-actions {
  display: flex;
  gap: 10px;
}

.card-action-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.3s var(--transition);
  position: relative;
  z-index: 10;
}

.card-action-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
  transform: scale(1.1);
}

.card-type {
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 500;
}

/* =========================================
   EMPTY STATE
   ========================================= */
.empty-state {
  display: none;
  text-align: center;
  padding: 6rem 2rem;
}

.empty-state.show { display: block; }

.empty-title {
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 1rem;
}

.empty-sub {
  font-size: 0.9rem;
  color: var(--text-muted);
}

/* =========================================
   BACK BUTTON
   ========================================= */
.back-section {
  display: flex;
  justify-content: center;
  padding: 3rem 0 2rem;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: var(--sans);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 14px 32px;
  cursor: pointer;
  text-decoration: none;
  border-radius: 2px;
  position: relative;
  overflow: hidden;
  transition: color 0.4s var(--transition), border-color 0.4s;
}

.back-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  transform: translateX(-101%);
  transition: transform 0.4s var(--transition);
}

.back-btn:hover {
  color: #fff;
  border-color: var(--accent);
}
.back-btn:hover::before { transform: translateX(0); }

.back-btn svg, .back-btn span { position: relative; z-index: 1; }

/* =========================================
   LIGHTBOX / IMAGE MODAL
   ========================================= */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s var(--transition);
}

.lightbox.open {
  opacity: 1;
  pointer-events: all;
}

.lightbox-bg {
  position: absolute;
  inset: 0;
  background: rgba(4,4,4,0.93);
  backdrop-filter: blur(20px);
}

.lightbox-inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  max-width: 90vw;
  max-height: 90vh;
  width: 860px;
}

.lightbox-img-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 6px;
  max-height: 70vh;
}

.lightbox-img {
  display: block;
  max-width: 100%;
  max-height: 70vh;
  object-fit: contain;
  border-radius: 6px;
  transition: opacity 0.35s, transform 0.35s;
}

.lightbox-img.switching {
  opacity: 0;
  transform: scale(0.96);
}

.lightbox-meta {
  text-align: center;
}

.lightbox-title {
  font-family: var(--serif);
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.lightbox-org {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.lightbox-counter {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  color: var(--accent);
  margin-top: 4px;
}

/* Arrows */
.lb-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(20,20,20,0.8);
  border: 1px solid var(--border);
  color: var(--text-primary);
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
  transition: all 0.3s;
  backdrop-filter: blur(8px);
}
.lb-arrow:hover { border-color: var(--accent); color: var(--accent); }
.lb-arrow.disabled { opacity: 0.2; pointer-events: none; }
.lb-prev { left: 24px; }
.lb-next { right: 24px; }

/* Close */
.lb-close {
  position: fixed;
  top: 24px; right: 24px;
  background: rgba(20,20,20,0.8);
  border: 1px solid var(--border);
  color: var(--text-primary);
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
  transition: all 0.3s;
  backdrop-filter: blur(8px);
}
.lb-close:hover { border-color: var(--accent); color: var(--accent); }

/* =========================================
   VIDEO MODAL
   ========================================= */
.video-modal {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s var(--transition);
}

.video-modal.open {
  opacity: 1;
  pointer-events: all;
}

.video-modal-bg {
  position: absolute;
  inset: 0;
  background: rgba(4,4,4,0.95);
  backdrop-filter: blur(24px);
}

.video-modal-inner {
  position: relative;
  z-index: 1;
  width: 90vw;
  max-width: 960px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.video-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.video-title {
  font-family: var(--serif);
  font-size: 1.2rem;
  font-weight: 700;
}

.vm-close {
  background: rgba(20,20,20,0.8);
  border: 1px solid var(--border);
  color: var(--text-primary);
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
}
.vm-close:hover { border-color: var(--accent); color: var(--accent); }

.video-frame-wrap {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}

.video-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--text-muted);
  text-align: center;
}

.video-placeholder svg { color: var(--accent); opacity: 0.7; }

.video-placeholder p {
  font-size: 0.85rem;
  line-height: 1.6;
}

/* =========================================
   RESPONSIVE
   ========================================= */
@media (max-width: 768px) {
  .projects-grid { grid-template-columns: 1fr; }
  .hero { min-height: 80vh; padding: 6rem 1.5rem 4rem; }
  .main { padding: 0 1.5rem 4rem; }
  .lb-arrow { display: none; }
  .filter-bar { gap: 8px; }
  .filter-btn { font-size: 0.72rem; padding: 8px 16px; }
}

@media (max-width: 480px) {
  .projects-grid { gap: 18px; }
  .card-img-wrap { height: 180px; }
}

/* Divider */
.section-divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin: 0 0 4rem;
}
</style>
</head>
<body>

<!-- =========================================
     HERO
     ========================================= -->
<section class="hero">
  <div class="hero-ghost">Projects</div>

  <div class="hero-inner">
    <div class="eyebrow">
      <div class="eyebrow-line"></div>
      <span class="eyebrow-text">Featured Work</span>
      <div class="eyebrow-line"></div>
    </div>

    <h1 class="hero-heading">Pro<em>j</em>ects</h1>
  </div>
</section>














<!-- =========================================
     MAIN
     ========================================= -->
<main class="main">

  <div class="section-divider"></div>

  <!-- Filter -->
  <div class="filter-section">
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="generative-ai">Gen AI Applications</button>
      <button class="filter-btn" data-filter="ml-models">ML Models</button>
      <button class="filter-btn" data-filter="computer-vision">Computer Vision</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="projects-grid" id="projectsGrid"></div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <p class="empty-title">No projects found</p>
    <p class="empty-sub">Try adjusting your  filter criteria.</p>
  </div>

  <!-- Back button -->
 <div class="back-section">
  <a href="index.html#hero" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 12H5M12 5l-7 7 7 7"/></svg>
    <span>Back to Portfolio</span>
  </a>
</div>

</main>

<!-- =========================================
     LIGHTBOX
     ========================================= -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <div class="lightbox-bg" id="lbBg"></div>
  <button class="lb-close" id="lbClose" aria-label="Close">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <button class="lb-arrow lb-prev" id="lbPrev" aria-label="Previous">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <button class="lb-arrow lb-next" id="lbNext" aria-label="Next">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <div class="lightbox-inner">
    <div class="lightbox-img-wrap">
      <img class="lightbox-img" id="lbImg" src="" alt="" />
    </div>
    <div class="lightbox-meta">
      <div class="lightbox-title" id="lbTitle"></div>
      <div class="lightbox-org" id="lbOrg"></div>
      <div class="lightbox-counter" id="lbCounter"></div>
    </div>
  </div>
</div>

<!-- =========================================
     VIDEO MODAL
     ========================================= -->
<div class="video-modal" id="videoModal" role="dialog" aria-modal="true">
  <div class="video-modal-bg" id="vmBg"></div>

/* =========================================
   STATE
   ========================================= */
let activeFilter = 'all';
let lbIndex = 0;
let lbVisible = [];

/* =========================================
   RENDER CARDS
   ========================================= */
function renderCards() {
  const grid = document.getElementById('projectsGrid');
  grid.innerHTML = '';

  const filtered = projects.filter(p => {
    return activeFilter === 'all' || p.category === activeFilter;
  });

  lbVisible = filtered;

  const emptyState = document.getElementById('emptyState');

  if (filtered.length === 0) {
    grid.style.display = 'none';
    emptyState.classList.add('show');
    return;
  }

  grid.style.display = 'grid';
  emptyState.classList.remove('show');

  filtered.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="card-img-wrap" data-lb-index="${i}">
        <img class="card-img" src="${p.img}" alt="${p.imgAlt}" loading="lazy" />
        <div class="card-num">${String(p.id).padStart(2,'0')}</div>
        <div class="card-cat">${p.categoryLabel}</div>
        <div class="card-zoom">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
      </div>
      <div class="card-footer">
        <div class="card-actions">
          <button class="card-action-btn github-btn" data-github="${p.github}" title="View on GitHub" aria-label="GitHub">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
          </button>
          <button class="card-action-btn video-btn" data-video="${p.video}" data-title="${p.title}" title="Watch demo video" aria-label="Demo video">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
        </div>
        <span class="card-type">${p.type}</span>
      </div>
    `;

    // Stagger
    setTimeout(() => {
      card.classList.add('visible');
    }, i * 60);

    grid.appendChild(card);
  });

  // Image click → lightbox
  grid.querySelectorAll('[data-lb-index]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.card-action-btn')) return;
      const idx = parseInt(el.dataset.lbIndex);
      openLightbox(idx);
    });
  });

  // GitHub click
  grid.querySelectorAll('.github-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const url = btn.dataset.github;
      if (url && url !== '#') window.open(url, '_blank');
    });
  });

  // Video click
  grid.querySelectorAll('.video-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openVideoModal(btn.dataset.video, btn.dataset.title);
    });
  });
}

/* =========================================
   FILTER LOGIC
   ========================================= */
document.getElementById('filterBar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  renderCards();
});

/* =========================================
   LIGHTBOX
   ========================================= */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbTitle = document.getElementById('lbTitle');
const lbOrg = document.getElementById('lbOrg');
const lbCounter = document.getElementById('lbCounter');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');

function openLightbox(idx) {
  lbIndex = idx;
  updateLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const p = lbVisible[lbIndex];
  lbImg.classList.add('switching');
  setTimeout(() => {
    lbImg.src = p.img;
    lbImg.alt = p.imgAlt;
    lbTitle.textContent = p.title;
    lbOrg.textContent = p.subtitle;
    lbCounter.textContent = `${lbIndex + 1} / ${lbVisible.length}`;
    lbImg.classList.remove('switching');
  }, 300);
  lbPrev.classList.toggle('disabled', lbIndex === 0);
  lbNext.classList.toggle('disabled', lbIndex === lbVisible.length - 1);
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbBg').addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; updateLightbox(); } });
lbNext.addEventListener('click', () => { if (lbIndex < lbVisible.length - 1) { lbIndex++; updateLightbox(); } });

// Keyboard
document.addEventListener('keydown', e => {
  if (lightbox.classList.contains('open')) {
    if (e.key === 'ArrowLeft' && lbIndex > 0) { lbIndex--; updateLightbox(); }
    if (e.key === 'ArrowRight' && lbIndex < lbVisible.length - 1) { lbIndex++; updateLightbox(); }
    if (e.key === 'Escape') closeLightbox();
  }
  if (videoModal.classList.contains('open') && e.key === 'Escape') closeVideoModal();
});

// Touch swipe (lightbox)
let swipeStartX = 0;
lightbox.addEventListener('touchstart', e => { swipeStartX = e.touches[0].clientX; }, { passive: true });
lightbox.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - swipeStartX;
  if (Math.abs(dx) < 40) return;
  if (dx < 0 && lbIndex < lbVisible.length - 1) { lbIndex++; updateLightbox(); }
  if (dx > 0 && lbIndex > 0) { lbIndex--; updateLightbox(); }
}, { passive: true });

/* =========================================
   VIDEO MODAL
   ========================================= */
   
const videoModal = document.getElementById('videoModal');

// Convert Google Drive URL → Embed URL
function getEmbedUrl(url) {
  if (!url) return '';

  // Google Drive
  if (url.includes('drive.google.com/file/d/')) {
    const match = url.match(/\/d\/([^/]+)/);

    if (match) {
      return `https://drive.google.com/file/d/${match[1]}/preview`;
    }
  }

  // YouTube
  if (url.includes('youtube.com/watch?v=')) {
    const id = new URL(url).searchParams.get('v');
    return `https://www.youtube.com/embed/${id}`;
  }

  // Vimeo
  if (url.includes('vimeo.com/')) {
    const id = url.split('/').pop();
    return `https://player.vimeo.com/video/${id}`;
  }

  return url;
}

function openVideoModal(videoUrl, title) {
  document.getElementById('vmTitle').textContent = title;

  const frame = document.getElementById('vmFrame');
  const embedUrl = getEmbedUrl(videoUrl);

  if (embedUrl) {
    frame.innerHTML = `
      <iframe
        width="100%"
        height="100%"
        src="${embedUrl}"
        frameborder="0"
        allowfullscreen
        allow="autoplay; encrypted-media"
        style="border-radius:8px;">
      </iframe>
    `;
  } else {
    frame.innerHTML = `
      <div class="video-placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.5">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>

        <p>
          Demo video for
          <strong style="color:var(--text-primary)">
            ${title}
          </strong>
          <br>
          coming soon.
        </p>
      </div>
    `;
  }

  videoModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeVideoModal() {
  videoModal.classList.remove('open');

  document.body.style.overflow = '';

  document.getElementById('vmFrame').innerHTML = '';
}

document.getElementById('vmClose')
  .addEventListener('click', closeVideoModal);

document.getElementById('vmBg')
  .addEventListener('click', closeVideoModal);

/* =========================================
   SCROLL REVEAL
   ========================================= */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

// Observe cards after render
function observeCards() {
  document.querySelectorAll('.card:not(.visible)').forEach(c => observer.observe(c));
}

/* =========================================
   INIT
   ========================================= */
renderCards();
</script>
